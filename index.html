<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Tecno Game">
    <title>Tecno Game</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,255,136,0.4);}
        body {background:#0a0a0a;color:#fff;font-family:-apple-system,Arial,sans-serif;padding:15px;min-height:100vh;}
        h1 {text-align:center;color:#00ff88;font-size:2.4rem;margin:25px 0;text-shadow:0 0 15px #00ff88;}
        .box {background:#1e1e1e;border-radius:18px;padding:22px;margin-bottom:20px;box-shadow:0 6px 25px rgba(0,0,0,0.5);}
        h2 {color:#00ff88;font-size:1.4rem;margin-bottom:15px;}
        input {width:100%;padding:16px;margin:10px 0 15px;border:none;border-radius:12px;background:#2b2b2b;color:#fff;font-size:1.1rem;}
        input:focus {outline:3px solid #00ff88;}
        button {
            width:100%;padding:18px;margin:12px 0;border:none;border-radius:12px;
            font-size:1.15rem;font-weight:bold;cursor:pointer;transition:all 0.2s;
        }
        button:active {transform:scale(0.95);filter:brightness(0.85);}
        .verde {background:#00c853;}
        .azul {background:#2962ff;}
        .naranja {background:#ff6d00;}
        .morado {background:#7b1fa2;}
        .rojo {background:#d50000;}
        #resultado {margin-top:15px;padding:16px;border-radius:12px;min-height:60px;}
        .fila {background:#292929;padding:15px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;}
        .disp {color:#00ff88;font-weight:bold;}
        .usado {color:#ff5252;font-weight:bold;}
        
        /* ✅ ESTILOS AGREGADOS */
        .ejemplo-texto {font-size:0.85rem;opacity:0.7;margin-top:-10px;margin-bottom:10px;display:block;}
        .acciones {display:flex;gap:8px;align-items:center;}
        .btn-icono {width:34px;height:34px;border-radius:8px;border:none;background:#383838;color:#fff;cursor:pointer;transition:0.2s;font-size:1rem;display:flex;align-items:center;justify-content:center;}
        .btn-icono:hover {background:#505050;}
        .qr-icono {color:#00ff88;}
        .borrar-icono {color:#ff5252;}
        .modal {display:none;position:fixed;z-index:999;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.92);padding-top:60px;}
        .modal-contenido {background:#1e1e1e;margin:auto;padding:25px;border:2px solid #00ff88;width:90%;max-width:320px;border-radius:18px;text-align:center;box-shadow:0 0 20px rgba(0,255,136,0.2);}
        .cerrar {color:#aaa;float:right;font-size:28px;font-weight:bold;cursor:pointer;margin-top:-15px;margin-right:-10px;}
        .cerrar:hover {color:#00ff88;}
        #camaraContainer {display:none;margin-top:15px;position:relative;padding:5px;border-radius:12px;background:#222;overflow:hidden;}
        #video {width:100%;border-radius:8px;}
        #canvas {display:none;}
        
        /* ✅ RECUADRO GUÍA PARA ESCANEAR */
        .guia-qr {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 2px solid #00ff88;
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }
        .esquina {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #00ff88;
            border-style: solid;
        }
        .esquina.arriba-izq {top:-2px;left:-2px;border-width: 3px 0 0 3px;}
        .esquina.arriba-der {top:-2px;right:-2px;border-width: 3px 3px 0 0;}
        .esquina.abajo-izq {bottom:-2px;left:-2px;border-width: 0 0 3px 3px;}
        .esquina.abajo-der {bottom:-2px;right:-2px;border-width: 0 3px 3px 0;}

        /* ✅ ESTILO CORREGIDO: BOTÓN ARRIBA Y QR CON FONDO BLANCO */
        .btn-descargar {
            background:#00c853;
            color:#fff;
            padding:10px 15px;
            border:none;
            border-radius:8px;
            margin:0 0 15px 0;
            cursor:pointer;
            font-weight:bold;
            width:auto;
        }
        .btn-descargar:hover {background:#009640;}

        #qrcode {
            padding: 12px;
            background-color: #ffffff !important;
            border-radius: 8px;
            display: inline-block;
        }
        
        /* ✅ ESTILO PARA EL TUTORIAL */
        .tutorial {
            background-color: #2a2a2a;
            border: 1px dashed #00ff88;
            border-radius:12px;
            padding:12px;
            margin-bottom:15px;
            font-size:0.85rem;
            line-height:1.5;
            color:#ccc;
        }
        .tutorial b {
            color:#00ff88;
        }
    </style>
    <!-- ✅ LIBRERÍAS QR CARGADAS CORRECTAMENTE -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>
    <h1>🔥 TECNO GAME 🔥</h1>

    <div class="box">
        <h2>➕ Crear nuevo código</h2>
        <span class="ejemplo-texto">Formato sugerido: TG-0001, TG-1001, etc.</span>
        <input type="text" id="codNuevo" placeholder="Escribe el código aquí..." maxlength="20">
        <button class="verde" onclick="guardar()">💾 Guardar Código</button>
    </div>

    <div class="box">
        <h2>🔍 Buscar / Gestionar</h2>
        <input type="text" id="codBuscar" placeholder="Escribe el código a buscar...">
        <button class="azul" onclick="buscar()">🔍 Buscar</button>
        <button class="naranja" onclick="marcarUsado()">✅ Marcar como Usado</button>
        <button class="morado" onclick="activarEscaner()">📷 Escanear Código QR</button>
        
        <div id="camaraContainer">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <!-- ✅ RECUADRO GUÍA VISUAL -->
            <div class="guia-qr">
                <div class="esquina arriba-izq"></div>
                <div class="esquina arriba-der"></div>
                <div class="esquina abajo-izq"></div>
                <div class="esquina abajo-der"></div>
            </div>
            <button class="rojo" onclick="cerrarEscaner()" style="position:absolute;top:8px;right:8px;padding:5px 10px;border-radius:6px;z-index:20;">❌</button>
        </div>

        <div id="resultado"></div>
    </div>

    <div class="box">
        <h2>📋 Códigos Generados (<span id="contador">0</span>)</h2>

        <!-- ✅ TUTORIAL -->
        <div class="tutorial">
            📘 <b>¿Cómo funciona?</b><br>
            • 📷 : Genera el Código QR y te permite descargarlo a tu galería.<br>
            • 🗑️ : Elimina este código del sistema definitivamente.
        </div>

        <div id="lista">
            <!-- ✅ EJEMPLO INICIAL -->
            <div class="fila">
                <b>TG-1001</b>
                <div style="display:flex;align-items:center;gap:12px;">
                    <span class="disp">Disponible</span>
                    <div class="acciones">
                        <button class="btn-icono qr-icono" onclick="generarQR('TG-1001')" title="Ver y descargar QR">📷</button>
                        <button class="btn-icono borrar-icono" onclick="eliminarCodigo('TG-1001')" title="Borrar este código">🗑️</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ✅ VENTANA QR CON BOTÓN ARRIBA -->
    <div id="modalQR" class="modal">
        <div class="modal-contenido">
            <span class="cerrar" onclick="cerrarModal()">&times;</span>
            <h3>📱 Código QR</h3>
            <!-- ✅ BOTÓN DE DESCARGA ARRIBA -->
            <a id="descargarQR" download="codigo-qr.png">
                <button class="btn-descargar">⬇️ Descargar a Galería</button>
            </a>
            <!-- ✅ EL QR SE PONE AQUÍ -->
            <div id="qrcode"></div>
        </div>
    </div>

    <script>
        // ✅ DATOS INICIALES
        let codigos = JSON.parse(localStorage.getItem('tecnoGameCodigos')) || {'TG-1001': 'Disponible'};
        
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let escaneoActivo = false;

        function guardarEnStorage() {
            localStorage.setItem('tecnoGameCodigos', JSON.stringify(codigos));
        }

        function actualizarVista() {
            const lista = document.getElementById("lista");
            const contador = document.getElementById("contador");
            lista.innerHTML = "";
            contador.textContent = Object.keys(codigos).length;

            if (Object.keys(codigos).length === 0) {
                lista.innerHTML = `<p style="text-align:center;opacity:0.7;padding:30px;">Aún no hay códigos guardados</p>`;
                return;
            }

            for (const c in codigos) {
                lista.innerHTML += `
                <div class="fila">
                    <b>${c}</b>
                    <div style="display:flex;align-items:center;gap:12px;">
                        <span class="${codigos[c]==='Disponible' ? 'disp' : 'usado'}">${codigos[c]}</span>
                        <div class="acciones">
                            <button class="btn-icono qr-icono" onclick="generarQR('${c}')" title="Ver y descargar QR">📷</button>
                            <button class="btn-icono borrar-icono" onclick="eliminarCodigo('${c}')" title="Borrar este código">🗑️</button>
                        </div>
                    </div>
                </div>`;
            }
        }

        function guardar() {
            const v = document.getElementById("codNuevo").value.trim().toUpperCase();
            if (!v) return alert("⚠️ Ingresa un código");
            if (codigos[v]) return alert("⚠️ Ya existe");
            codigos[v] = "Disponible";
            guardarEnStorage();
            document.getElementById("codNuevo").value = "";
            actualizarVista();
            alert("✅ Código guardado correctamente");
        }

        function buscar() {
            const v = document.getElementById("codBuscar").value.trim().toUpperCase();
            const r = document.getElementById("resultado");
            if (!v) {
                r.textContent = "⚠️ Ingresa un código";
                r.style.background = "#503800";
                return;
            }
            if (codigos[v]) {
                r.textContent = `Estado: ${codigos[v]}`;
                r.style.background = codigos[v] === "Disponible" ? "#005c31" : "#503800";
            } else {
                r.textContent = "❌ No encontrado";
                r.style.background = "#503800";
            }
        }

        function marcarUsado() {
            const v = document.getElementById("codBuscar").value.trim().toUpperCase();
            if (!codigos[v]) return alert("❌ Este código no existe");
            if (codigos[v] === "Usado") return alert("ℹ️ Ya está marcado como usado");
            if (confirm(`¿Marcar ${v} como USADO?`)) {
                codigos[v] = "Usado";
                guardarEnStorage();
                buscar();
                actualizarVista();
                alert("✅ Marcado como usado");
            }
        }

        function eliminarCodigo(cod) {
            if(confirm(`🗑️ ¿Eliminar definitivamente el código:\n${cod}?`)){
                delete codigos[cod];
                guardarEnStorage();
                actualizarVista();
                alert("✅ Borrado correctamente");
            }
        }

        // ✅ FUNCIÓN GENERAR QR (INTACTA, IGUAL QUE ANTES)
        function generarQR(texto) {
            const modal = document.getElementById("modalQR");
            const contenedor = document.getElementById("qrcode");
            const enlaceDescarga = document.getElementById("descargarQR");
            
            contenedor.innerHTML = "";
            modal.style.display = "block";

            const canvasQR = document.createElement('canvas');
            
            QRCode.toCanvas(canvasQR, texto, { 
                width: 220, 
                color: { dark: '#00ff88', light: '#ffffff' },
                margin: 1
            }, function (error) {
                if (error) {
                    alert("❌ Error al generar: " + error);
                    return;
                }
                contenedor.appendChild(canvasQR);
                enlaceDescarga.href = canvasQR.toDataURL("image/png");
            });
        }

        function cerrarModal() {
            document.getElementById("modalQR").style.display = "none";
        }

        // ✅ FUNCIÓN ESCANEAR CORREGIDA AHORA SÍ - LEE Y COMPARA BIEN
        function activarEscaner() {
            const contenedor = document.getElementById("camaraContainer");
            const r = document.getElementById("resultado");
            contenedor.style.display = "block";
            r.innerHTML = "";
            escaneoActivo = true;

            navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false})
            .then(stream => {
                video.srcObject = stream;
                video.play();
                requestAnimationFrame(escanearLoop);
            })
            .catch(e => alert("❌ No se pudo acceder a la cámara"));
        }

        function escanearLoop() {
            if(video.readyState === video.HAVE_ENOUGH_DATA && escaneoActivo){
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video,0,0,canvas.width,canvas.height);
                
                let codigoQR = jsQR(ctx.getImageData(0,0,canvas.width,canvas.height).data, canvas.width, canvas.height);
                if(codigoQR){
                    // ✅ LIMPIAMOS Y PASAMOS A MAYÚSCULAS PARA QUE COINCIDA SIEMPRE
                    let valorLeido = codigoQR.data.trim().toUpperCase();
                    procesarEscaneo(valorLeido);
                    return;
                }
            }
            if(escaneoActivo) requestAnimationFrame(escanearLoop);
        }

        function procesarEscaneo(valor) {
            const r = document.getElementById("resultado");
            // ✅ COMPARACIÓN EXACTA Y SEGURA
            if(codigos.hasOwnProperty(valor)){
                if(codigos[valor] === "Disponible"){
                    r.innerHTML = `✅ DISPONIBLE: ${valor}`;
                    r.style.background = "#005c31";
                } else {
                    r.innerHTML = `⚠️ USADO: ${valor}`;
                    r.style.background = "#503800";
                }
            } else {
                r.innerHTML = `❌ NO REGISTRADO: ${valor}`;
                r.style.background = "#503800";
            }
            cerrarEscaner();
        }

        function cerrarEscaner() {
            escaneoActivo = false;
            document.getElementById("camaraContainer").style.display = "none";
            if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
        }

        window.onclick = e => {
            const m = document.getElementById("modalQR");
            if(e.target === m) m.style.display = "none";
        }

        // ✅ INICIAR
        actualizarVista();
    </script>
</body>
</html>
